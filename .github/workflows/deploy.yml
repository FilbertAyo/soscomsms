name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to shared hosting
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build frontend
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, tokenizer, xml, ctype, json, bcmath, curl, zip, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: |
          cp .env.example .env
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Pack release as tar.gz
        run: |
          tar --exclude-vcs --exclude-from=scripts/deploy-exclude.txt -czf /tmp/soscomsms-release.tar.gz .
          test -s /tmp/soscomsms-release.tar.gz
          cp /tmp/soscomsms-release.tar.gz soscomsms-release.tar.gz

      - name: Ensure the remote app directory exists
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: mkdir -p "${{ secrets.DEPLOY_PATH }}"

      - name: Upload release archive
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: soscomsms-release.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Extract release and run deploy script
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            if [ ! -f soscomsms-release.tar.gz ]; then
              echo "Release archive was not uploaded."
              exit 1
            fi
            rm -rf vendor public/build
            tar -xzf soscomsms-release.tar.gz
            rm -f soscomsms-release.tar.gz
            if [ -n "${{ secrets.PHP_BIN }}" ]; then
              export PHP_BIN="${{ secrets.PHP_BIN }}"
            fi
            bash scripts/deploy.sh
