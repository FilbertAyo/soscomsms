name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to shared hosting
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install and build frontend
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, tokenizer, xml, ctype, json, bcmath, curl, zip, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: |
          cp .env.example .env
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Pack release as tar.gz
        run: |
          tar --exclude-vcs --exclude-from=scripts/deploy-exclude.txt -czf /tmp/soscomsms-release.tar.gz .
          test -s /tmp/soscomsms-release.tar.gz
          cp /tmp/soscomsms-release.tar.gz soscomsms-release.tar.gz

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"
          {
            echo "Host production"
            echo "  HostName ${SSH_HOST}"
            echo "  User ${SSH_USERNAME}"
            echo "  Port ${PORT}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ensure the remote app directory exists
        run: ssh production "mkdir -p '${{ secrets.DEPLOY_PATH }}'"

      - name: Upload release archive
        run: scp soscomsms-release.tar.gz "production:${{ secrets.DEPLOY_PATH }}/soscomsms-release.tar.gz"

      - name: Extract release and run deploy script
        env:
          PHP_BIN: ${{ secrets.PHP_BIN }}
        run: |
          ssh production "set -euo pipefail
            cd '${{ secrets.DEPLOY_PATH }}'
            if [ ! -f soscomsms-release.tar.gz ]; then
              echo 'Release archive was not uploaded.'
              exit 1
            fi
            rm -rf vendor public/build
            tar -xzf soscomsms-release.tar.gz
            rm -f soscomsms-release.tar.gz
            if [ -n '${PHP_BIN}' ]; then
              export PHP_BIN='${PHP_BIN}'
            fi
            bash scripts/deploy.sh"
